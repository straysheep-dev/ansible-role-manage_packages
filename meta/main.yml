# SPDX-License-Identifier: MIT
galaxy_info:
  author: straysheep-dev
  namespace: straysheep_dev
  role_name: manage_packages
  description: Maintain basic package inventories for automated builds.
  license: license (MIT)

  min_ansible_version: "2.10"

  platforms:
    - name: Ubuntu
      versions:
        - all
    - name: Debian
      versions:
        - all
    - name: Kali
      versions:
        - all
    - name: Fedora
      versions:
        - all
    - name: EL
      versions:
        - all

  galaxy_tags:
    - packaging
    - apt
    - dnf
    - snap
    - flatpak
    - pip
    - system
    - administration
    - packages

dependencies: []
